# ---------- PAWS ----------

[[node]]
id = "paws_wave_cluster"
kind = "symptom"
name = "PAWS wave/window cluster"
summary = "Episodic waves of emotional blunting, anxiety, insomnia, cognitive fog, sensory disturbance alternating with windows of relative normality, persisting weeks to many months after psychotropic cessation."
conditions = ["paws"]
tier = "C"
sources = ["Ashton benzodiazepine manual", "post-SSRI withdrawal case literature"]
review_by = "2027-06-01"

[[node]]
id = "receptor_resensitization_lag"
kind = "root_cause"
name = "Receptor resensitization lag"
summary = "Receptor-level adaptations persisting after drug cessation and recovering on their own timescale — the reason time and gentleness are the best-evidenced management. No probe; gradual spontaneous windows are its signature evidence."
conditions = ["paws"]
tier = "C"
sources = ["protracted withdrawal literature (Ashton, Breggin)"]
probes = []
review_by = "2027-06-01"

[[node]]
id = "hpa_dysregulation"
kind = "root_cause"
name = "HPA axis dysregulation"
summary = "Blunted stress-response cycling after psychotropic exposure; morning cortisol would probe it (analyte pending — a listed gap)."
conditions = ["paws"]
tier = "C"
sources = ["HPA axis withdrawal literature"]
probes = [
    { analyte = "cortisol_am", expect = "above", weight = 0.10 },
]
review_by = "2027-06-01"

[[node]]
id = "glutamatergic_rebound"
kind = "root_cause"
name = "Glutamatergic rebound / E-I rebalancing"
summary = "Excitatory-inhibitory rebalancing after drug cessation; best documented in the benzodiazepine literature."
conditions = ["paws"]
tier = "C"
sources = ["benzodiazepine withdrawal literature"]
probes = []
review_by = "2027-06-01"

[[node]]
id = "endocrine_mimic_paws"
kind = "root_cause"
name = "Endocrine and deficiency mimics (PAWS)"
summary = "Thyroid dysfunction, low testosterone, iron deficiency, and vitamin D shortfall reproduce withdrawal-brain symptoms and are correctable; the PAWS card's biomarker list exists to exclude these first."
conditions = ["paws"]
tier = "B"
sources = ["endocrine contributions to mood/fatigue literature"]
probes = [
    { analyte = "testosterone_total", expect = "below", weight = 0.10 },
    { analyte = "tsh", expect = "above", weight = 0.10 },
    { analyte = "ferritin", expect = "below", weight = 0.10 },
    { analyte = "vitamin_d_25oh", expect = "below", weight = 0.05 },
]
review_by = "2027-06-01"

