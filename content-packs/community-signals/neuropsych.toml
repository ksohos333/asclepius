# Community signals: structured patient-community outcome reports.
# Direction + approximate report count + review date. These are tier-D
# curatorial claims — the point is that a countable, reviewable signal beats
# prose buried in a sources list. Hurt signals at/above the threshold
# (reports >= 10) screen items out of proposals; helped signals flag
# community support WITHOUT inflating any evidence tier.

[[signal]]
id = "berberine_crash"
item_id = "berberine"
direction = "hurt"
reports = 30
summary = "Repeatedly named in post-drug crash reports; broad antimicrobial gut action with delayed hard-to-attribute onset."
tier = "D"
sources = ["r/PSSD and post-drug community crash threads (approximate count as of review date)"]
review_by = "2027-01-15"

