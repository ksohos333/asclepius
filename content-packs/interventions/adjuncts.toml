interactions = [{ with = "serotonergic", effect = "additive serotonergic activity; case-reported trigger of sensory loss in recovery", severity = "avoid" }]
targets = []
sources = ["SAM-e antidepressant RCT literature", "patient-community documentation of SAM-e-triggered setbacks (tier D)", "epigenetic methylation hypotheses of PSSD (tier C)"]
confidence = "low"
