[[intervention]]
id = "saffron"
name = "Saffron (Crocus sativus, standardized extract)"
category = "botanical"
tier = "B"
summary = "Documented serotonergic activity with RCTs comparing it to fluoxetine for mood. A genuine gray zone in PSSD recovery: mechanistically it loads the serotonergic system the literature implicates, yet some individuals report stable multi-domain benefit without setbacks during recovery — one documented case (tier D) reports benefit for erectile function, mood, energy, and cold/immunity resistance at 100 mg/day through late recovery. If used: fixed modest dose, one change at a time, tracked sensation and mood response, stop if sensation regresses."
dosing = [{ form = "standardized extract", min = 28, max = 100, unit = "mg/day", notes = "mood RCTs typically 28-30 mg; higher doses are patient-directed; multi-domain benefit documented at 100 mg in one recovery case" }]
classes = ["serotonergic"]
interactions = [{ with = "serotonergic", effect = "additive serotonergic burden — relevant in post-SSRI contexts", severity = "caution" }]
targets = []
sources = ["saffron vs fluoxetine mood RCTs", "saffron serotonergic mechanism studies", "patient-community reports of tolerance during recovery (tier D)"]
confidence = "low"
review_by = "2026-12-15"

[[intervention]]
id = "multispecies_probiotic_skin"
name = "Multispecies Probiotic (skin-formulated)"
category = "nutrient"
tier = "C"
summary = "Oral multispecies probiotics have small-RCT signal for acne via the gut-skin axis. Product quality markers that matter: named strains (not species alone), declared CFU at end of shelf life, and attention to co-formulated actives (zinc, vitamin D) that stack with existing supplementation. No product-level serotonergic evidence; species-level tryptophan-metabolism literature exists but cannot be attributed to products that do not declare strains. Mechanistically OPPOSITE to the antimicrobial class implicated in post-drug 'crash' reports (rifaximin, doxycycline, berberine — all kill gut flora): probiotics add live organisms and kill nothing. Gentle start: half label dose (1 cap vs 2) for the first week, then full dose if no regression."
dosing = [{ form = "capsules as labelled", min = 1, max = 2, unit = "capsules/day", notes = "gentle start: 1 cap/day week one, then label dose if no regression; check label for zinc and vitamin D content to avoid stacking; separate from medications by 1-2 hours if the product contains glucomannan or similar fiber" }]
ceiling = { amount = 25, unit = "mg/day total supplemental zinc from all sources", reason = "EFSA tolerable upper intake for zinc; chronic excess depletes copper" }
targets = ["acne_root_causes"]
sources = ["oral probiotics and acne small RCTs (tier C)", "EFSA zinc upper intake guidance", "gut-brain tryptophan metabolism literature (species-level, not product-attributable)"]
confidence = "low"
review_by = "2026-12-15"
