id = "sam_e"
name = "SAM-e (S-Adenosylmethionine)"
category = "nutrient"
tier = "B"
summary = "Methyl donor with real antidepressant evidence. Documented in patient reports to trigger or deepen post-drug sexual dysfunction during incomplete recovery — both serotonergic activity and epigenetic methylation are mechanistically implicated in PSSD hypotheses. Present in this library for safety documentation, never proposed."
dosing = [{ form = "not recommended in post-drug recovery contexts", min = 0, max = 0, unit = "n/a", notes = "do not self-administer in PSSD/PAWS contexts" }]
