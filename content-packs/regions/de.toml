# Germany country layer. The German system runs on the Überweisung
# (referral): statutory-insurance (GKV) lab work normally needs a physician
# order; private self-pay labs (Selbstzahler) will run almost anything
# without one. Review dates matter — coverage rules drift.

[region]
country = "DE"
bloc = "EU"
name = "Germany"
locale = "de"

