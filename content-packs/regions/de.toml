[[physician_route]]
condition = "acne_root_causes"
note = "Evidence-order routing as elsewhere. German specifics: a Hausarzt (GP) referral is the normal door to GKV specialist visits; private Selbstzahler routes bypass it entirely. Dermatology manages lesions and any isotretinoin decision (strict iClonis/iPledge-equivalent pregnancy-prevention rules apply)."
review_by = "2027-03-01"

[[physician_route.rank]]
specialty = "gastroenterology"
when = "Leading gut-skin hypothesis, transient antibiotic response, or digestive symptoms."
script_de = "Ich möchte einen SIBO-Atemtest (Laktulose, H2/CH4) machen lassen, um die Ursache meiner Akne genauer einzugrenzen, bevor wir eine weitere Isotretinoin-Therapie erwägen. Meine Befunde und meine Krankengeschichte habe ich dabei."
script_en = "I want a SIBO breath test (lactulose, H2/CH4) to narrow down the driver of my acne before considering another isotretinoin course. I have my results and history with me."

[[physician_route.rank]]
specialty = "endocrinology"
when = "Androgen or insulin markers move: free T, SHBG, DHEA-S, IGF-1, fasting insulin."
script_de = "Ich habe rezidivierende zystische Akne und hätte gern Ihre Einschätzung zur Androgen-Insulin-Achse: Gesamt-/freies Testosteron, SHBG, DHEA-S, Nüchtern-Insulin. Eine Kontrolle in drei Monaten ist geplant."
script_en = "I have recurrent cystic acne and would like your assessment of the androgen-insulin axis: total/free testosterone, SHBG, DHEA-S, fasting insulin. A retest in three months is planned."

[[physician_route.rank]]
specialty = "dermatology"
when = "Lesion control, scarring risk, or an isotretinoin decision."
script_de = "Meine Akne kehrt nach Isotretinoin und Antibiotika zurück — ich arbeite parallel an der Ursache (Darm-Diagnostik, Hormonachse). Ich würde gern Ihre Unterstützung bei der Behandlung der Läsionen und Ihre Einschätzung, wann eine erneute Isotretinoin-Therapie sinnvoll wäre."
script_en = "My acne recurs after isotretinoin and antibiotics — I am working on the root cause in parallel. I would like your help with lesion management and your view on when a repeat isotretinoin course would make sense."
review_by = "2027-03-01"
