# Greece country layer: how to actually get things done in the Greek system.
# Two parallel worlds: EOPYY (public insurer) coverage via referral from a
# contracted physician, and private labs/functional labs you can walk into
# without one. Legal classes and coverage rules drift — review dates matter.

[region]
country = "GR"
bloc = "EU"
name = "Greece"
locale = "el"

[[test_route]]
test_id = "sibo_lactulose_breath"
requires_referral = false
routes = [
    { kind = "private_functional_lab", note = "functional-medicine labs in Athens/Thessaloniki offer lactulose H2/CH4 breath testing direct-to-consumer", cost_estimate = "60-120 EUR" },
    { kind = "specialist_order", specialty = "gastroenterology", note = "a gastroenterologist can order and — more importantly — interpret it medically and act on the result" },
]
notes = "EOPYY coverage for breath testing is inconsistent and often limited to specific indications; the private route is the realistic first move. Prefer dual-gas (H2+CH4) panels."
review_by = "2027-03-01"

[[test_route]]
test_id = "comprehensive_stool_panel"
requires_referral = false
routes = [
    { kind = "private_functional_lab", note = "comprehensive stool kits (microbiology + calprotectin + elastase) sold DTC by functional labs; sample ships by courier", cost_estimate = "80-180 EUR" },
]
notes = "Standard Greek clinical labs run calprotectin individually if you only need the inflammation marker — cheaper than a full panel."
review_by = "2027-03-01"

[[test_route]]
test_id = "serum_igf1"
requires_referral = false
routes = [
    { kind = "private_lab_direct", note = "any private diagnostic lab (biopathology); walk-in, results in 1-2 days", cost_estimate = "25-50 EUR" },
    { kind = "eopyy_referral", note = "covered with a referral from any contracted physician (usually endocrinology/pediatrics contexts)" },
]
notes = "Committing the result needs the igf_1 analyte defined in the packs first (currently a listed gap)."
review_by = "2027-03-01"

[[test_route]]
test_id = "serum_dhea_s"
requires_referral = false
routes = [
    { kind = "private_lab_direct", note = "any private diagnostic lab; walk-in", cost_estimate = "15-35 EUR" },
    { kind = "eopyy_referral", note = "covered with referral for endocrine workups" },
]
notes = "Same gap note: dhea_s analyte definition pending before results can be committed."
review_by = "2027-03-01"

[[test_route]]
test_id = "fasting_insulin_glucose_recheck"
requires_referral = false
routes = [
    { kind = "private_lab_direct", note = "every private lab; morning fasting draw, results same day", cost_estimate = "10-25 EUR" },
    { kind = "eopyy_referral", note = "fully covered with any physician referral" },
]
notes = "The cheapest, highest-leverage recheck on the list — do not overthink the venue, mind the fast."
review_by = "2027-03-01"

[[legal_class]]
