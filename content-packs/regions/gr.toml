class = "otc"
note = "sold as a food supplement in pharmacies and health stores; no prescription needed"
review_by = "2027-03-01"

[[product]]
id = "eftonia_skin_beauty"
name = "Eftonia Skin Beauty"
vendor = "Eftonia"
maps_to = ["multispecies_probiotic_skin"]
format = "2 capsules/day: 13-strain probiotic blend 240 mg + glucomannan 180 mg + zinc 10 mg + vitamin D 10 µg"
disclosure = "Label discloses '13-strain blend' and total probiotic mass but NOT strain identities or CFU counts — the probiotic card's product-quality markers (named strains, end-of-shelf-life CFU) are only partially met. The zinc (10 mg/cap-pair) sits well under the 25 mg/day stacking ceiling but counts toward it; vitamin D 10 µg (400 IU) is a maintenance dose."
caveats = [
    "glucomannan fiber content: separate from any medications by 1-2 hours (the probiotic card says exactly this)",
    "zinc here stacks with any standalone zinc supplement — count all sources against the 25 mg/day ceiling",
    "gentle start applies: 1 capsule/day for the first week before the full 2-cap label dose"
]
cost_estimate = "Greek pharmacy / online pricing; verify at purchase"
availability = "Greek pharmacies and online retailers"
tier = "C"
sources = ["user-supplied label data (patient profile, started 2026-10-29)", "oral probiotics and acne small RCTs (class evidence, tier C)"]
review_by = "2027-03-01"

[[legal_class]]
item_id = "ashwagandha"
class = "grey"
note = "EU novel-food ambiguity applies; availability in Greek pharmacies/health stores fluctuates — verify current listing at purchase"
review_by = "2027-03-01"

[[physician_route]]
condition = "acne_root_causes"
note = "Order matters when the evidence has a leader. With a dominant gut-skin hypothesis, the gastroenterologist is the door that opens the discriminating test; dermatology remains essential for lesion management and any isotretinoin decision — the point is coordination, not replacement. EOPYY-covered visits need a referral from a GP/contracted physician for non-emergency specialties; private visits (and private labs) need nothing but an appointment."
review_by = "2027-03-01"

[[physician_route.rank]]
specialty = "gastroenterology"
when = "Leading gut-skin hypothesis, transient antibiotic response, or digestive symptoms: the SIBO breath test and stool workup live here."
script_el = "Θα ήθελα να ερευνήσουμε την πιθανότητα SIBO/δυσβίωσης ως ρίζα της κυστικής ακμής — μια δοκιμασία αναπνοής με λακτουλόζη (H2/CH4) θα διαχωρίσει τις υποθέσεις πριν ξανασκεφτούμε ισοτρετινοΐνη. Έχω το ιστορικό και τις εξετάσεις μου μαζί."
script_en = "I want to investigate SIBO/dysbiosis as the driver of my cystic acne — a lactulose breath test (H2/CH4) would discriminate between the hypotheses before we consider another isotretinoin course. I have my history and labs with me."

[[physician_route.rank]]
specialty = "endocrinology"
when = "Androgen or insulin markers move: free T, SHBG, DHEA-S, IGF-1, fasting insulin interpretation and follow-up."
script_el = "Έχω κυστική ακμή με υποτροπιάζουσα πορεία και θα ήθελα την εκτίμησή σας στον άξονα ανδρογόνων-ινσουλίνης: ολική/ελεύθερη τεστοστερόνη, SHBG, DHEA-S, ινσουλίνη νηστείας. Υπάρχει οικογενειακό ιστορικό; Όχι. Σκοπεύω να ξαναμετρήσω σε 3 μήνες."
script_en = "I have recurrent cystic acne and would like your read on the androgen-insulin axis: total/free testosterone, SHBG, DHEA-S, fasting insulin. I plan to retest in 3 months against these baselines."

[[physician_route.rank]]
specialty = "dermatology"
when = "Lesion control, scarring risk, or an isotretinoin decision — bring the root-cause workup and ask for coordination."
script_el = "Η ακμή μου υποτροπιάζει μετά από ισοτρετινοΐνη και αντιβίωση — δουλεύω παράλληλα στη ρίζα (έλεγχος εντέρου, ορμονικός άξονας). Θα ήθελα τον συντονισμό σας για τη διαχείριση των βλαβών όσο διαρκεί ο έλεγχος, και τη γνώμη σας για το πότε μια νέα πορεία ισοτρετινοΐνης θα είχε νόημα."
script_en = "My acne recurs after isotretinoin and antibiotics — I am working on the root cause in parallel (gut workup, hormone axis). I would like your help managing lesions meanwhile, and your view on when a repeat isotretinoin course would make sense."
review_by = "2027-03-01"
