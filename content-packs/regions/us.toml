[[physician_route]]
condition = "acne_root_causes"
note = "Same evidence-order routing as elsewhere: when the gut hypothesis leads, GI opens the discriminating test. US-specific: direct-access labs mean you can arrive at any visit with data already in hand; dermatology remains essential for lesion management and isotretinoin decisions (iPLEDGE program requirements apply)."
review_by = "2027-03-01"

[[physician_route.rank]]
specialty = "gastroenterology"
when = "Leading gut-skin hypothesis, transient antibiotic response, or digestive symptoms."
script_en = "I want to investigate SIBO/dysbiosis as the driver of my cystic acne — a lactulose breath test (H2/CH4) would discriminate between the hypotheses before we consider another isotretinoin course. I can bring my own labs and history."

[[physician_route.rank]]
specialty = "endocrinology"
when = "Androgen or insulin markers move: free T, SHBG, DHEA-S, IGF-1, fasting insulin."
script_en = "I have recurrent cystic acne and would like your read on the androgen-insulin axis: total/free testosterone, SHBG, DHEA-S, fasting insulin. I plan to retest in 3 months against these baselines."

[[physician_route.rank]]
specialty = "dermatology"
when = "Lesion control, scarring risk, or an isotretinoin decision — bring the root-cause workup and ask for coordination."
script_en = "My acne recurs after isotretinoin and antibiotics — I am working on the root cause in parallel (gut workup, hormone axis). I would like your help managing lesions meanwhile, and your view on when a repeat isotretinoin course would make sense."
review_by = "2027-03-01"
