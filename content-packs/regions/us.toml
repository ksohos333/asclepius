# United States country layer. Coverage rules drift by state and insurer —
# review dates matter. Direct-access testing is broad but insurance-driven:
# a physician order usually decides who pays, not whether you can test.

[region]
country = "US"
name = "United States"
locale = "en"

[[test_route]]
test_id = "sibo_lactulose_breath"
requires_referral = false
routes = [
    { kind = "direct_access_lab", note = "breath test kits sold direct-to-consumer and via functional-medicine/telehealth practices", cost_estimate = "$100-200 self-pay" },
    { kind = "specialist_order", specialty = "gastroenterology", note = "GI ordering makes interpretation and follow-up part of the same visit" },
]
notes = "Insurance coverage for breath testing varies widely and often requires documented symptoms plus a GI order."
review_by = "2027-03-01"

[[test_route]]
test_id = "comprehensive_stool_panel"
requires_referral = false
