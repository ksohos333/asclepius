[package]
name = "asclepius-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server shell exposing the Asclepius physician over stdio"

[dependencies]
asclepius-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[dependencies.rmcp]
version = "3"
features = ["server", "transport-io"]

[dependencies.tokio]
version = "1"
features = ["macros", "rt-multi-thread", "io-std"]
